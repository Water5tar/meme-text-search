name: MemeSearch
options:
  bundleIdPrefix: com.memeocr
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MemeSearch:
    type: application
    platform: iOS
    sources:
      - Sources
    scheme:
      testTargets:
        - MemeSearchTests
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memeocr.local.ios
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Meme 文字搜索"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "仅读取你允许的照片，在本机识别文字以便搜索表情包。"
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        CODE_SIGN_STYLE: Automatic
  MemeSearchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MemeSearch
